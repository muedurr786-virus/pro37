{% extends "base/base.html" %}
{% block cao %}

<form class="container" action="" method="post">
    {% csrf_token %}

    {{form.as_per}}

    <button class="btn btn-primary" type="submit">submit</button>
</form>

<table>
    <thead>
        <tr>
            <th>t_name</th>
            <th>t_dept</th>
            <th>t_email</th>
            <th>t_phone</th>
            <th>bio</th>
        </tr>
    </thead>
    <tbody>
        {% for d in dept %}
        <tr>
            <td>{{d.t_name}}</td>
            <td>{{d.t_dept}}</td>
            <td>{{d.t_email}}</td>
            <td>{{d.t_phone}}</td>
            <td>{{d.bio}}</td>
            
            
        </tr>
        
        {% endfor %}
    </tbody>
</table>

{% endblock cao %}
